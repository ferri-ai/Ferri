name: ferri
description: AI agent that lives inside your phone.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  flutter_markdown: ^0.7.6
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  health: ^11.1.0
  path: ^1.9.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/provider-metadata.json
    - assets/skills/skill-creator/
    - assets/skills/morning-briefing/
    - assets/skills/meeting-prep/
    - assets/skills/travel-assistant/
    - assets/skills/health-check/
